name: release-python
on:
  push:
    tags: ['python-v*']
permissions:
  contents: read
  id-token: write # PyPI trusted publishing: no token stored anywhere
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: The tag matches the version being published
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "python-v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} but pyproject says $v"; exit 1; }
      - run: pip install -e '.[test]' build && pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
